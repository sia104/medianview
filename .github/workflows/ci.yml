name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Run ruff
        run: ruff check .

      - name: Run mypy
        run: mypy src tests
